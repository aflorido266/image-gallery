<div class="relative w-full h-full">

  <img [src]="image().url" [alt]="image().alt" [class.featured]="featured()"
    class="w-full h-full object-cover rounded-xl" />

  <button (click)="remove.emit(image().id)"
    class="absolute top-2 right-2 bg-red-500 text-white rounded-full w-8 h-8 flex items-center justify-center hover:bg-red-700 transition">
    🗑️
  </button>


</div>
